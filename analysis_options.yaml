# This file tells Dart/Flutter how to check your code.
# Think of it like a "quality checker" that warns you about possible mistakes,
# bad style, or things that may cause problems later.
#
# In simple terms: it helps you write cleaner, safer code.

# This line loads the default Flutter lint rules.
# These are recommended rules for Flutter apps, packages, and plugins.
include: package:flutter_lints/flutter.yaml

analyzer:
  # These folders are excluded from analysis.
  # We ignore generated or platform-specific build files because they are not
  # the code we normally want to edit or review manually.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # This is where we can customize which lint rules are active.
  # You can turn rules on or off here for the whole project.
  #
  # For example, if a rule is annoying for a specific project,
  # you can disable it here or ignore it in one file.
  #
  # A single file can ignore a lint like this:
  # // ignore: avoid_print
  #
  # Or for the whole file:
  # // ignore_for_file: avoid_print
  rules:
    # Example:
    # avoid_print: false
    # This would disable the warning that says "don't use print".
    #
    # Example:
    # prefer_single_quotes: true
    # This would prefer single quotes instead of double quotes.

# This is the standard Flutter/Dart analysis config.
# You can read more here:
# https://dart.dev/guides/language/analysis-options
